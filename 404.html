<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P Organizer</title>
<script>
  /* Cualquier dirección que no exista dentro de la app (por ejemplo, un enlace de confirmación
     del email con una ruta de más) vuelve a la app conservando la sesión que trae el enlace. */
  (function () {
    var base = '/Claude-personal-Organizer/';
    var hash = location.hash, search = location.search;
    if (!hash && /access_token=|error_description=/.test(search)) { hash = '#' + search.slice(1); search = ''; }
    location.replace(base + search + hash);
  })();
</script>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;font:16px -apple-system,system-ui,sans-serif;background:#000;color:#fff}</style>
</head>
<body>Abriendo P Organizer…</body>
</html>

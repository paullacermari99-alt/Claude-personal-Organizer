  <meta name="theme-color" content="#eef1f7">
  <script>/* Apariencia (Ajustes): 'auto' sigue al sistema; 'light' o 'dark' fijos. Se aplica antes de pintar para que no haya destello. */
    (function () {
      var mq = matchMedia('(prefers-color-scheme: dark)');
      window.themePref = function () { try { var v = localStorage.getItem('organizador.theme'); return v === 'light' || v === 'dark' ? v : 'auto'; } catch (e) { return 'auto'; } };
      /* Estilo (Ajustes → Apariencia): '' = Cristal, el de siempre */
      var SKIN_BG = { '': ['#eef1f7', '#05060a'], sereno: ['#f5f3ef', '#121110'], vivo: ['#f6f0ff', '#0d0818'], compacto: ['#eef1f7', '#05060a'] };
      window.skinPref = function () { try { var v = localStorage.getItem('organizador.skin') || ''; return SKIN_BG[v] ? v : ''; } catch (e) { return ''; } };
      window.applyTheme = function () {
        var p = themePref(), t = p === 'auto' ? (mq.matches ? 'dark' : 'light') : p, k = skinPref(), el = document.documentElement;
        el.setAttribute('data-theme', t);
        if (k) el.setAttribute('data-skin', k); else el.removeAttribute('data-skin');
        var m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = SKIN_BG[k][t === 'dark' ? 1 : 0];
      };
      applyTheme();
      try { mq.addEventListener('change', applyTheme); } catch (e) { mq.addListener && mq.addListener(applyTheme); }
    })();</script>
